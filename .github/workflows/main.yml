name: Build Shree Pathology Lab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q Shree_Pathology_Lab_Android_V7-2.zip -d project

          GRADLEW=$(find project -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"
          echo 'android.enableJetifier=true' >> "$PROJECT_DIR/gradle.properties"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Force Java and Kotlin JVM target to 17
        run: |
          cat > "$RUNNER_TEMP/ci.gradle" <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.configureEach { task ->
                  if (task.class.name.contains("KotlinCompile") && task.hasProperty("kotlinOptions")) {
                      task.kotlinOptions.jvmTarget = "17"
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon -I "$RUNNER_TEMP/ci.gradle" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shree-Pathology-Lab-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error 
